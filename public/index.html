<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
          }
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r) || 'Error';
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Bread Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <link rel="stylesheet" href="/tailwind.css">
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <main class="max-w-md mx-auto px-4 py-8 flex flex-col gap-5">

    <header>
      <h1 class="text-2xl font-bold">Bread Bot</h1>
      <p class="text-sm text-zinc-400 mt-1">Pick your bread, size it, and get weights, rise times and baking instructions.</p>
    </header>

    <form id="calc-form" class="flex flex-col gap-5">
      <section class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
        <label for="bread-type" class="block text-sm font-medium text-zinc-400 mb-2">Bread type</label>
        <select id="bread-type" class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2.5 text-base text-zinc-100 focus:border-violet-500 focus:outline-none"></select>
        <p id="bread-note" class="text-xs text-zinc-500 mt-2"></p>
      </section>

      <section class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
        <label for="hydration" class="block text-sm font-medium text-zinc-400 mb-2">Hydration</label>
        <select id="hydration" class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2.5 text-base text-zinc-100 focus:border-violet-500 focus:outline-none"></select>
        <p id="hydration-note" class="text-xs text-zinc-500 mt-2"></p>
      </section>

      <section class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4 flex flex-col gap-4">
        <div>
          <label for="loaf-count" id="loaf-count-label" class="block text-sm font-medium text-zinc-400 mb-2">Number of loaves</label>
          <select id="loaf-count" class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2.5 text-base text-zinc-100 focus:border-violet-500 focus:outline-none"></select>
        </div>
        <div>
          <label for="loaf-size" id="loaf-size-label" class="block text-sm font-medium text-zinc-400 mb-2">Loaf size</label>
          <select id="loaf-size" class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2.5 text-base text-zinc-100 focus:border-violet-500 focus:outline-none"></select>
          <p id="loaf-size-note" class="text-xs text-zinc-500 mt-2"></p>
        </div>
      </section>
    </form>

    <section id="result" class="rounded-xl border border-violet-500/30 bg-violet-600/10 p-4 flex flex-col gap-4"></section>

    <p class="text-center text-xs text-zinc-600">Times are a starting point. Watch the dough, not the clock: cooler rooms slow everything down.</p>
  </main>

  <script src="/js/app.js?v=2"></script>
</body>
</html>
